services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tasks
      POSTGRES_USER: tasks
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Run start.ps1 or create .env first}
    volumes:
      - task-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U tasks -d tasks"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  server:
    build: ./server
    environment:
      DATABASE_URL: postgresql+psycopg://tasks:${DB_PASSWORD}@db/tasks
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  web:
    build: ./client
    ports:
      - "127.0.0.1:8095:80"
    depends_on:
      - server
    restart: unless-stopped
volumes:
  task-data:
